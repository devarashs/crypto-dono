services:
  crypto-dono:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    volumes:
      # A named volume rather than a ./data bind mount: on Linux, Docker creates a
      # missing bind-mount directory owned by root, which the container's
      # unprivileged user cannot write. Back up with:
      #   docker compose cp crypto-dono:/app/data ./backup
      - crypto-dono-data:/app/data
      # Your own alert sound and image, see custom/README.md. Read-only: the
      # service never writes here.
      - ./custom:/app/custom:ro

  # Optional text-to-speech. Started only with: docker compose --profile tts up
  # and used once .env has TTS_URL=http://piper:5000. Not published on a host
  # port: only crypto-dono talks to it, over the compose network.
  piper:
    build: ./piper
    profiles: ["tts"]
    restart: unless-stopped
    environment:
      # Check the voice's MODEL_CARD licence before choosing another one.
      PIPER_VOICE: ${PIPER_VOICE:-en_US-ljspeech-medium}
    volumes:
      - piper-voices:/voices

volumes:
  crypto-dono-data:
  piper-voices:
